name: Sondagem de um ponto

# Gera a sondagem de qualquer ponto do domínio de 1 km a partir do estado 3D guardado pela última rodada.
# A imagem vai para a branch "sondagens", porque o download do release é octet-stream e o navegador não desenha no mapa.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitude (graus decimais)"
        required: true
        type: string
      lon:
        description: "Longitude (graus decimais)"
        required: true
        type: string
      tempo:
        description: "Horário válido AAAAMMDDHH (UTC)"
        required: true
        type: string
      init:
        description: "Inicialização do ICON, AAAA-MM-DDTHH (UTC)"
        required: false
        default: ""
        type: string
      nome:
        description: "Nome do arquivo de saída, sem extensão"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sondagem
  cancel-in-progress: false

jobs:
  sondagem:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restaurar o estado 3D da última rodada
        uses: actions/cache/restore@v4
        with:
          path: estado_cache
          key: estado-inexistente
          restore-keys: |
            estado-

      - name: Restaurar limites e rodovias
        uses: actions/cache/restore@v4
        with:
          path: dados/vetores
          key: vetores-v2-${{ hashFiles('scripts/vetores.py') }}

      - name: Instalar bibliotecas Python
        run: pip install numpy scipy matplotlib

      - name: Gerar a sondagem
        env:
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          TEMPO: ${{ inputs.tempo }}
          INIT: ${{ inputs.init }}
          NOME: ${{ inputs.nome }}
        run: |
          case "$NOME" in (*[!A-Za-z0-9._-]*|"") echo "nome inválido"; exit 1;; esac
          ls estado_cache | head -20
          python scripts/sondagem_ponto.py --estado estado_cache --tempo "$TEMPO" --lat "$LAT" --lon "$LON" \
            --init "$INIT" --saida "$NOME.png"

      - name: Publicar a imagem no site
        env:
          NOME: ${{ inputs.nome }}
        run: |
          set -euo pipefail
          BR=sondagens
          WORK=/tmp/sondagens-pub
          rm -rf "$WORK"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BR" "https://github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          else
            mkdir -p "$WORK"
            git -C "$WORK" init -b "$BR"
            git -C "$WORK" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp "$NOME.png" "$WORK/$NOME.png"
          export WORK
          python3 -c 'from pathlib import Path; import os; work=Path(os.environ["WORK"]); novo=os.environ["NOME"]+".png"; antigos=sorted(p for p in work.glob("sond_*.png") if p.name!=novo); [p.unlink() for p in antigos[:-39]]'
          git -C "$WORK" config user.name "github-actions[bot]"
          git -C "$WORK" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$WORK"
          git -C "$WORK" add -A
          if git -C "$WORK" diff --cached --quiet; then
            echo "Nada novo para publicar."
          else
            git -C "$WORK" commit -m "sondagem ${NOME}"
            git -C "$WORK" -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" push origin "HEAD:${BR}"
          fi

      - name: Publicar no release
        env:
          NOME: ${{ inputs.nome }}
        run: |
          gh release view vale1km > /dev/null 2>&1 || gh release create vale1km --title "Vale1Km (status e sondagens)" --notes "{}"
          gh release upload vale1km "$NOME.png" --clobber
          gh release view vale1km --json assets --jq '.assets | map(select(.name | startswith("sond_"))) | sort_by(.createdAt) | reverse | .[40:] | .[].name' \
            | while read -r a; do gh release delete-asset vale1km "$a" -y || true; done
