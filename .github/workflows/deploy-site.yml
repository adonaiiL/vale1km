name: Vale1Km - atualizar site sem recalcular WRF

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'viewer.js'
      - 'scripts/termo.py'
      - 'scripts/leitura.py'
      - 'scripts/plotar.py'
      - 'scripts/mapas.py'
      - 'scripts/sondagem.py'
      - 'scripts/sondagem_ponto.py'
      - 'scripts/vetores.py'
      - 'scripts/dominio.py'
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/vale1km.yml'
  workflow_run:
    workflows: ['Vale1Km']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: vale1km-pages
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ (github.event_name != 'push' || !contains(github.event.head_commit.message, '[sem-mapas]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código da interface
        uses: actions/checkout@v4

      - name: Recuperar e processar os resultados da última rodada WRF
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p site/resultados
          UI_ONLY=0
          if [[ "${GITHUB_EVENT_NAME}" == "push" && -n "${GITHUB_EVENT_PATH:-}" ]]; then
            if jq -e '.head_commit.message | strings | contains("[ui]")' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
              UI_ONLY=1
              echo "Atualização de interface: reutilizando os mapas já publicados, sem redesenhar."
            fi
          fi
          RUN_ID="${TRIGGER_RUN_ID}"
          ARTIFACT_ID=""
          if [[ "$UI_ONLY" != 1 ]]; then
          # Em evento workflow_run, prioriza exatamente a execução que acabou de terminar.
          if [[ -n "$RUN_ID" ]]; then
            ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("wrf-brutos-d03-")))] | sort_by(.created_at) | if length > 0 then .[-1].id else empty end' || true)"
          fi
          # Em push/manual, ou se o run disparador não tiver o TAR, procura o artefato
          # bruto mais recente. Isso também recupera uma rodada cujo job de publicação antigo falhou.
          if [[ -z "$ARTIFACT_ID" ]]; then
            for candidate in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/vale1km.yml/runs?per_page=100" --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id'); do
              found="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("wrf-brutos-d03-")))] | sort_by(.created_at) | if length > 0 then .[-1].id else empty end' || true)"
              if [[ -n "$found" ]]; then RUN_ID="$candidate"; ARTIFACT_ID="$found"; break; fi
            done
          fi
          fi

          if [[ -n "$ARTIFACT_ID" ]]; then
            echo "Recuperando o TAR WRF da execução $RUN_ID (artefato $ARTIFACT_ID), sem recalcular o modelo."
            curl -fLsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/wrf-brutos.zip
            python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import tarfile
          archive = Path("/tmp/wrf-brutos.zip")
          target = Path("/tmp/wrf-brutos-d03.tar")
          with ZipFile(archive) as z:
              candidates = [n for n in z.namelist() if n.endswith("wrf-brutos-d03.tar")]
              if not candidates:
                  raise SystemExit("O artefato não contém wrf-brutos-d03.tar")
              target.write_bytes(z.read(candidates[0]))
          out = Path("recuperado")
          out.mkdir(exist_ok=True)
          with tarfile.open(target, "r:") as t:
              root = out.resolve()
              for member in t.getmembers():
                  dest = (out / member.name).resolve()
                  if root not in dest.parents and dest != root:
                      raise SystemExit(f"Caminho inseguro no TAR: {member.name}")
              t.extractall(out)
          print("Arquivos brutos WRF extraídos.")
          PY

            # A rodada atual pode não conter metadados (artefato criado antes desta correção).
            # Nesse caso, usa o primeiro e o último horário efetivamente gravados pelo WRF.
            eval "$(python3 - <<'PY'
          import glob, json, os, re, shlex
          from pathlib import Path
          meta_path = Path("recuperado/dados/rodada.json")
          manifesto_path = Path("recuperado/dados/manifesto.json")
          meta = json.loads(meta_path.read_text()) if meta_path.is_file() else {}
          manifesto = json.loads(manifesto_path.read_text()) if manifesto_path.is_file() else {}
          files = sorted(glob.glob("recuperado/wrf/wrfout_d03_*"))
          if not files:
              raise SystemExit("O TAR não contém wrfout_d03 para pós-processamento.")
          init = meta.get("init") or manifesto.get("init")
          if not init:
              raise SystemExit("O manifesto não informa a inicialização do ICON.")
          # Um wrfout só traz a hora inicial no nome (frames_per_outfile=1000).
          # A janela real está no namelist, não nesse nome.
          ini, fim, passo = meta.get("janela_ini"), meta.get("janela_fim"), meta.get("passo_h")
          nl = Path("recuperado/wrf/namelist.input")
          if not ini or not fim:
              if not nl.is_file():
                  raise SystemExit("O TAR não tem a janela da rodada nem namelist.input.")
              text = nl.read_text(errors="replace")
              def primeiro(chave):
                  m = re.search(rf"\b{chave}\s*=\s*([^,\s!]+)", text)
                  if not m:
                      raise SystemExit(f"namelist.input sem {chave}")
                  return int(float(m.group(1)))
              def selo(prefixo):
                  return f"{primeiro(prefixo + '_year'):04d}-{primeiro(prefixo + '_month'):02d}-{primeiro(prefixo + '_day'):02d}T{primeiro(prefixo + '_hour'):02d}"
              ini = ini or selo("start")
              fim = fim or selo("end")
              if passo is None and re.search(r"\bhistory_interval\s*=", text):
                  passo = max(1, primeiro("history_interval") // 60)
          passo = max(1, int(passo or 1))
          for k,v in {"INIT":init,"INI":ini,"FIM":fim,"PASSO":str(max(1,passo))}.items():
              print(f"{k}={shlex.quote(v)}")
          PY
          )"
            echo "Pós-processamento: ICON $INIT; janela $INI até $FIM; mapas a cada $PASSO h."
            export VALE1KM_INIT="$INIT"
            bash scripts/progresso.sh 85 "WRF terminou. Gerando mapas e sondagens"
            python -m pip install --disable-pip-version-check numpy scipy matplotlib netCDF4
            python scripts/plotar.py --wrf recuperado/wrf --init "$INIT" --ini "$INI" --fim "$FIM" \
              --passo "$PASSO" --saida site/resultados --estado estado_cache
            test -s site/resultados/manifest.json
          else
            echo "Nenhum TAR WRF disponível; tentando reutilizar o artefato antigo de resultados."
            # Compatibilidade com execuções anteriores que ainda geraram resultados-*.
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/vale1km.yml/runs?per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].id // empty')"
            OLD_ID=""
            if [[ -n "$RUN_ID" ]]; then
              OLD_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("resultados-")))] | sort_by(.created_at) | if length > 0 then .[-1].id else empty end' || true)"
            fi
            if [[ -n "$OLD_ID" ]]; then
              curl -fLsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${OLD_ID}/zip" -o /tmp/vale1km-resultados.zip
              python3 - <<'PY'
          import json, shutil
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          out = Path("site/resultados")
          with ZipFile("/tmp/vale1km-resultados.zip") as z:
              candidates = [PurePosixPath(i.filename) for i in z.infolist() if not i.is_dir() and PurePosixPath(i.filename).name == "manifest.json"]
              if not candidates: raise SystemExit("O artefato antigo não contém manifest.json")
              base = min(candidates, key=lambda p: len(p.parts)).parent
              for info in z.infolist():
                  if info.is_dir(): continue
                  p = PurePosixPath(info.filename)
                  try: rel = p.relative_to(base)
                  except ValueError: continue
                  if len(rel.parts) == 1 and rel.name not in ("", ".", "..") and (rel.name == "manifest.json" or rel.suffix.lower() in (".png", ".json")):
                      with z.open(info) as src, (out / rel.name).open("wb") as dst: shutil.copyfileobj(src, dst)
          doc = json.loads((out / "manifest.json").read_text(encoding="utf-8"))
          if not doc.get("tempos"): raise SystemExit("Manifesto antigo sem horários.")
          PY
            else
              echo "Não há artefato WRF nem resultados antigos. Tentando preservar a publicação atual."
              export PAGES_BASE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
              python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          base = os.environ["PAGES_BASE_URL"].rstrip("/") + "/resultados/"
          out = Path("site/resultados"); out.mkdir(parents=True, exist_ok=True)
          def get(url):
              req = Request(url + "?_=" + str(time.time_ns()), headers={"Cache-Control":"no-cache","User-Agent":"Vale1Km-site-deploy"})
              with urlopen(req, timeout=30) as r: return r.read()
          data = get(base + "manifest.json")
          if data.endswith(b"\\n"): data = data[:-2]
          doc = json.loads(data.decode("utf-8"))
          (out / "manifest.json").write_bytes(data)
          names = set()
          for t in doc.get("tempos", []):
              names.update((t.get("mapas") or {}).values())
              names.update((t.get("sondagens") or {}).values())
              if t.get("grade"): names.add(t["grade"])
          if not doc.get("tempos") or not names: raise SystemExit("Não há rodada publicada para preservar.")
          for name in names:
              safe = Path(str(name)).name
              if safe != name: raise SystemExit(f"Nome inesperado: {name}")
              try: (out / safe).write_bytes(get(base + safe))
              except Exception as e:
                  if safe.startswith("grade_"): print(f"Grade ausente: {safe}: {e}")
                  else: raise
          PY
            fi
          fi

      - name: Montar site corrigido
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s index.html
          test -s viewer.js
          test -s site/resultados/manifest.json
          cp index.html site/index.html
          cp viewer.js site/viewer.js
          touch site/.nojekyll
          du -sh site site/resultados

      - name: Preparar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # upload-pages-artifact@v3 finaliza o upload antes de a API de Actions
      # necessariamente listá-lo. deploy-pages consulta essa API por nome; sem
      # aguardar a propagação, pode receber uma lista vazia logo após o upload.
      - name: Aguardar propagação do artefato do Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
          for tentativa in $(seq 1 30); do
            artifact="$(gh api "$endpoint" --jq '[.artifacts[]? | select(.name == "github-pages" and .expired == false)] | sort_by(.created_at) | last // empty' 2>/dev/null || true)"
            if [[ -n "$artifact" ]]; then
              artifact_id="$(jq -r '.id' <<< "$artifact")"
              artifact_size="$(jq -r '.size_in_bytes' <<< "$artifact")"
              if [[ "$artifact_size" =~ ^[0-9]+$ ]] && (( artifact_size > 0 )); then
                echo "Artefato github-pages visível na API: ID $artifact_id, $artifact_size bytes."
                exit 0
              fi
            fi
            echo "Artefato github-pages ainda não visível (tentativa $tentativa/30); aguardando 3s."
            sleep 3
          done
          echo "::error::O upload do Pages terminou, mas a API do GitHub não listou o artefato após 90 segundos."
          gh api "$endpoint" --jq '.artifacts[]? | {id,name,size_in_bytes,expired,created_at}' || true
          exit 1

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Progresso, publicada
        if: success() && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/progresso.sh 100 "Rodada concluída e publicada" concluido

      - name: Progresso, falha ao publicar
        if: failure() && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[ui]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/progresso.sh 97 "Falha ao gerar ou publicar os mapas" erro
