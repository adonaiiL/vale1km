name: Diagnostico independente da sondagem

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnostico_sondagem.py'
      - '.github/workflows/diagnostico-sondagem.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da execução Vale1Km com os dados WRF brutos"
        required: true
        default: "45372699705"
        type: string
      artifact_name:
        description: "Nome do artefato WRF bruto"
        required: true
        default: "wrf-brutos-d03-2026-11-24T06"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vale1km-diagnostico-sondagem
  cancel-in-progress: false

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Baixar artefato bruto já existente
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'wrf-brutos-d03-2026-11-24T06' }}
          run-id: ${{ inputs.run_id || '45372699705' }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source-artifact
      - name: Extrair WRF
        shell: bash
        run: |
          set -euo pipefail
          TAR_FILE="$(find source-artifact -type f -name '*.tar' -print -quit)"
          test -n "$TAR_FILE"
          mkdir -p extracted
          tar -xf "$TAR_FILE" -C extracted
          test -n "$(find extracted/wrf -maxdepth 1 -name 'wrfout_d03_*' -print -quit)"
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check numpy scipy netCDF4 metpy
      - name: Auditar o perfil 18Z
        run: python scripts/diagnostico_sondagem.py --wrf extracted/wrf --time 2026-11-24T18 --out sondagem-audit
      - name: Adicionar relatório ao resumo
        if: always()
        run: if [ -f sondagem-audit/report.md ]; then cat sondagem-audit/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Guardar relatório e perfis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-sondagem-${{ github.run_id }}
          path: sondagem-audit/
          if-no-files-found: warn
          retention-days: 14
