<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vale1Km</title>
<style>
:root{--bg:#eef1f4;--fg:#18222d;--card:#fff;--ln:#d3d9e0;--ac:#0b5ed7;--mu:#5d6876;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--fg:#e6eaf0;--card:#171f29;--ln:#2a3544;--ac:#5aa2ff;--mu:#94a1b2}}
:root[data-theme="dark"]{--bg:#0f141a;--fg:#e6eaf0;--card:#171f29;--ln:#2a3544;--ac:#5aa2ff;--mu:#94a1b2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"DejaVu Sans",sans-serif}
header{padding:10px 14px;background:var(--card);border-bottom:1px solid var(--ln)}
h1{margin:0;font-size:22px}header p{margin:2px 0 0;color:var(--mu);font-size:12px}
main{max-width:1400px;margin:auto;padding:10px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:10px;min-width:0}
button,input,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px 12px;min-height:40px;min-width:0}
button{cursor:pointer}.on{background:var(--ac);border-color:var(--ac);color:#fff}.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}
.sc{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}.sc>button{flex:0 0 auto;text-align:center;line-height:1.25}
small{display:block;font-size:11px;opacity:.75}.m{color:var(--mu);font-size:12px;margin:4px 0}
.bar{height:16px;border-radius:99px;background:var(--ln);overflow:hidden}.bar>i{display:block;height:100%;width:0;background:var(--ac);transition:width .6s}
.bar.err>i{background:#d32f2f}
.fig{position:relative;background:#fff;border:1px solid var(--ln);border-radius:6px;overflow:hidden;touch-action:manipulation}
.fig img{display:block;width:100%;height:auto}.dot{position:absolute;width:18px;height:18px;margin:-9px;border:3px solid #000;border-radius:50%;background:#ffe600;pointer-events:none}
details>summary{cursor:pointer;font-weight:600;padding:6px 0}label{display:block;font-size:12px;color:var(--mu);margin:6px 0 2px}
@media(min-width:900px){#cfg .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}}
@media(max-width:600px){h1{font-size:19px}button,input,select{min-height:44px}}
</style>
</head>
<body>
<header><h1>Vale1Km</h1><p>WRF 1 km com ICON Global, Blumenau e Pomerode (SC)</p></header>
<main>
<section class="card" id="pg">
 <div class="row"><b id="pt">Sem rodada em andamento</b><span class="m" id="pm"></span></div>
 <div class="bar" id="bar"><i></i></div>
</section>
<section class="card">
 <div class="sc" id="tb"></div>
 <div class="row" style="margin:6px 0"><div class="sc" id="tabs"></div></div>
 <div class="sc" id="op"></div>
 <p class="m" id="info"></p>
 <div class="fig" id="fig"><img id="im" alt="Resultado do Vale1Km"><span class="dot" id="dot" hidden></span></div>
 <div class="row" style="margin-top:8px"><a id="dl" download><button type="button">Baixar imagem</button></a></div>
 <div id="pk" hidden class="card" style="margin-top:8px">
  <p class="m">Toque no mapa para escolher o ponto, ou digite as coordenadas.</p>
  <div class="row"><input id="la" inputmode="decimal" placeholder="Latitude (-26.83)"><input id="lo" inputmode="decimal" placeholder="Longitude (-49.12)"><button id="gs" class="p" type="button">Gerar sondagem deste ponto</button></div>
  <p class="m" id="ps"></p>
 </div>
</section>
<section class="card" id="cfg">
 <details><summary>Rodar o modelo e configurar o acesso</summary>
  <div class="g">
   <div><label for="rp">Repositório (usuário/repo)</label><input id="rp" style="width:100%;box-sizing:border-box"></div>
   <div><label for="tk">Token do GitHub (actions:write)</label><input id="tk" type="password" style="width:100%;box-sizing:border-box"></div>
   <div><label for="id">Inicialização ICON (UTC)</label><div class="row"><input id="id" type="date"><select id="ih"><option>00<option>06<option>12<option>18</select></div></div>
   <div><label for="vd">Dia válido e janela UTC</label><div class="row"><input id="vd" type="date"><select id="h0"></select><select id="h1"></select></div></div>
  </div>
  <div class="row" style="margin-top:8px"><label>Intervalo dos mapas (h)</label><select id="st"><option>1<option>3<option>6</select><button id="bd" type="button">Só baixar ICON</button><button id="br" class="p" type="button">Baixar e rodar WRF 1 km</button></div>
  <p class="m" id="msg"></p>
 </details>
</section>
</main>
<script>
const $=s=>document.querySelector(s),z=n=>String(n).padStart(2,'0');
const PT={A:'Adonai',F:'Fabrício',K:'Kelvin',Ko:'Komprão'};
const PR=[['rf','Refletividade'],['ws','Ventos'],['t2','Temperatura'],['rh','Umidade'],['pr','Precipitação'],['td','Orvalho'],['sn','Neve'],['fr','Geada'],['ml','MLCAPE'],['mu','MUCAPE'],['sc','SCP'],['vo','Vort. 850'],['sh','Cisalhamento'],['hd','Hodomap']];
let M=null,tab='m',ti=0,cur='rf',pt='A',pick=null,custom=null,rel=null;
const ss=(k,v)=>{try{return v===undefined?sessionStorage.getItem(k):sessionStorage.setItem(k,v)}catch(e){return null}};
const rp=$('#rp'),tk=$('#tk');
const h=location.hostname.endsWith('github.io')?location.hostname.split('.')[0]+'/'+(location.pathname.split('/')[1]||''):'';
rp.value=ss('rp')||h;tk.value=ss('tk')||'';
rp.onchange=()=>ss('rp',rp.value);tk.onchange=()=>ss('tk',tk.value);
const api=(p,o)=>fetch('https://api.github.com/repos/'+rp.value.trim()+p,{...o,headers:{Accept:'application/vnd.github+json',...(tk.value?{Authorization:'Bearer '+tk.value.trim()}:{}),...(o&&o.headers)}});
function chips(id,arr,sel,fn){const e=$(id);e.innerHTML=arr.map(([k,l,s])=>`<button class="${k==sel?'on':''}" data-k="${k}">${l}${s?`<small>${s}</small>`:''}</button>`).join('');e.onclick=ev=>{const b=ev.target.closest('button');if(b)fn(b.dataset.k)}}
function draw(){
 const T=M?M.tempos:[],t=T[ti];
 chips('#tb',T.map((x,i)=>[i,x.utc.slice(8,10)+'/'+x.utc.slice(5,7)+' '+x.utc.slice(11,13)+'Z',x.brt.slice(11,13)+'h Brasília']),ti,k=>{ti=+k;draw()});
 chips('#tabs',[['m','Mapa'],['s','Sondagem']],tab,k=>{tab=k;custom=null;draw()});
 chips('#op',tab=='m'?PR:[...Object.keys(PT).map(k=>[k,k+' '+PT[k]]),['x','Outro ponto']],tab=='m'?cur:pt,k=>{tab=='m'?cur=k:pt=k;custom=null;draw()});
 $('#pk').hidden=!(tab=='s'&&pt=='x');
 let src='';
 if(!t){$('#info').textContent='Ainda não há resultados publicados. Rode o modelo abaixo.';$('#im').removeAttribute('src');$('#dl').removeAttribute('href');return}
 if(tab=='m')src='resultados/'+t.mapas[cur];
 else if(pt=='x')src=custom||'resultados/'+t.mapas.rf;
 else src='resultados/'+t.sondagens[pt];
 $('#im').src=src;$('#dl').href=src;$('#dl').download=src.split('/').pop();
 $('#info').textContent=`Inicialização ${M.init.replace('T',' ')}Z · válido ${t.utc.replace('T',' ')}Z (${t.brt.slice(11,13)}h Brasília)`;
 $('#dot').hidden=!(tab=='s'&&pt=='x'&&pick&&!custom);
}
async function load(){try{M=await(await fetch('resultados/manifest.json',{cache:'no-store'})).json()}catch(e){M=null}draw()}
$('#fig').onclick=e=>{
 if(!(tab=='s'&&pt=='x')||custom||!M||!M.geom)return;
 const g=M.geom,r=$('#im').getBoundingClientRect(),fx=(e.clientX-r.left)/r.width*g.W,fy=(e.clientY-r.top)/r.height*g.H;
 const lo=g.lon0+(fx-g.x0)/g.w*(g.lon1-g.lon0),la=g.lat1-(fy-g.y0)/g.h*(g.lat1-g.lat0);
 if(lo<g.lon0||lo>g.lon1||la<g.lat0||la>g.lat1)return;
 pick=[la,lo];$('#la').value=la.toFixed(4);$('#lo').value=lo.toFixed(4);
 const d=$('#dot');d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';d.hidden=false};
$('#gs').onclick=async()=>{
 const la=parseFloat($('#la').value),lo=parseFloat($('#lo').value),t=M&&M.tempos[ti];
 if(!t||isNaN(la)||isNaN(lo)){$('#ps').textContent='Informe latitude e longitude.';return}
 if(!tk.value){$('#ps').textContent='Informe o token do GitHub (seção abaixo).';return}
 const nome=`sond_${t.utc.replace(/\D/g,'').slice(0,10)}_${la.toFixed(4)}_${lo.toFixed(4)}`;
 $('#ps').textContent='Pedido enviado. Leva de 2 a 3 minutos...';
 const r=await api('/actions/workflows/sondagem.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main',inputs:{lat:la.toFixed(4),lon:lo.toFixed(4),tempo:t.utc.replace(/\D/g,'').slice(0,10),init:M.init,nome}})});
 if(r.status!=204){$('#ps').textContent='O GitHub respondeu '+r.status+'. Confira repositório e token.';return}
 for(let i=0;i<60;i++){await new Promise(s=>setTimeout(s,6000));
  const j=await(await api('/releases/tags/vale1km')).json(),a=(j.assets||[]).find(x=>x.name==nome+'.png');
  if(a){custom=a.browser_download_url;$('#ps').textContent='Pronto.';draw();return}}
 $('#ps').textContent='Demorou demais. Veja a aba Actions do repositório.'};
async function prog(){
 if(!rp.value.includes('/'))return;
 try{const r=await api('/releases/tags/vale1km');if(!r.ok)return;const j=await r.json();rel=JSON.parse(j.body);
  const b=$('#bar');b.firstElementChild.style.width=rel.pct+'%';b.classList.toggle('err',rel.status=='erro');
  $('#pt').textContent=rel.status=='concluido'?'Rodada concluída':rel.status=='erro'?'A rodada falhou':`Rodada em andamento: ${rel.pct}%`;
  $('#pm').textContent=rel.msg+' · atualizado '+new Date(rel.atualizado).toLocaleTimeString('pt-BR')}catch(e){}}
setInterval(prog,tk.value?20000:60000);
// ---- disparar rodadas
['h0','h1'].forEach(i=>$('#'+i).innerHTML=[...Array(24).keys()].map(n=>`<option>${z(n)}`).join(''));
const f=t=>new Date(t).toISOString().slice(0,10),n=Date.now();
$('#id').value=f(n);$('#ih').value='12';$('#vd').value=f(n+2*864e5);$('#h0').value='15';$('#h1').value='21';
async function go(modo){
 const[y,m,d]=$('#vd').value.split('-').map(Number),a=+$('#h0').value;let b=+$('#h1').value;if(b<a)b+=24;
 const t=h=>new Date(Date.UTC(y,m-1,d,h)).toISOString().slice(0,13);
 const inp={modo,dominio:'vale1km',init:$('#id').value+'T'+$('#ih').value,janela_ini:t(a),janela_fim:t(b),passo_h:$('#st').value};
 if(!tk.value){$('#msg').textContent='Informe o token.';return}
 const r=await api('/actions/workflows/vale1km.yml/dispatches',{method:'POST',body:JSON.stringify({ref:'main',inputs:inp})});
 $('#msg').textContent=r.status==204?'Rodada enviada. Acompanhe a barra de progresso no topo.':'O GitHub respondeu '+r.status+'.';setTimeout(prog,8000)}
$('#bd').onclick=()=>go('baixar');$('#br').onclick=()=>go('baixar_e_rodar');
load();prog();
</script>
</body>
</html>
